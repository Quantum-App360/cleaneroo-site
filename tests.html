// Contrôle de cohérence du catalogue : doublons, packs, types, occasions (même contrôle que l'appli)
import("./assets/js/catalogue.js").then(() => {});
{
  const { RUBRIQUES, TYPES_LIEU, formulesPour } = await import("./assets/js/catalogue.js");
  const pb = [];
  const ids = RUBRIQUES.map(r => r.id);
  if (new Set(ids).size !== ids.length) pb.push("rubrique en double");
  for (const r of RUBRIQUES) {
    const t = r.taches.map(x => x.id), types = (TYPES_LIEU[r.id] || []).map(x => x.id);
    if (new Set(t).size !== t.length) pb.push(`${r.id} : tâche en double`);
    if (new Set(types).size !== types.length) pb.push(`${r.id} : type en double`);
    const noms = r.taches.map(x => x.nom); if (new Set(noms).size !== noms.length) pb.push(`${r.id} : libellé de tâche en double`);
    for (const p of r.packs) for (const id of p.tacheIds) if (!t.includes(id)) pb.push(`${r.id} : pack ${p.id} → tâche inconnue ${id}`);
    for (const x of r.taches) for (const ty of x.types) if (!types.includes(ty)) pb.push(`${r.id} : tâche ${x.id} → type inconnu ${ty}`);
    for (const p of r.packs) for (const ty of (p.types || [])) if (!types.includes(ty)) pb.push(`${r.id} : pack ${p.id} → type inconnu ${ty}`);
    for (const o of r.occasions) if (o.packId && !r.packs.some(p => p.id === o.packId)) pb.push(`${r.id} : occasion ${o.id} → pack inconnu`);
    const f = formulesPour(r).map(x => x.id); if (new Set(f).size !== f.length) pb.push(`${r.id} : formule en double`);
    for (const x of r.taches) if (!(x.prixC > 0 && x.minutes > 0)) pb.push(`${r.id} : tâche ${x.id} sans prix ou durée`);
  }
  egal("catalogue cohérent (doublons, packs, types, occasions)", pb.join(" ; "), "");
}

    // Parrainage : remise de bienvenue 10 € (dès 40 €) et cagnotte, crédit d'impôt sur ce qui est vraiment payé
    const filleul = parcours({ rubriqueId: "home", formuleId: "ponctuel", remiseParrainageC: 1000 });

    const avecCagnotte = parcours({ rubriqueId: "home", formuleId: "ponctuel", remiseParrainageC: 1000, utiliserCagnotte: true, cagnotteDispoC: 2000 });

    egal("cagnotte non cochée : rien d'utilisé", parcours({ rubriqueId: "home", formuleId: "ponctuel", cagnotteDispoC: 2000 }).cagnotteC, 0);
    const grosse = parcours({ rubriqueId: "home", formuleId: "ponctuel", remiseParrainageC: 1000, utiliserCagnotte: true, cagnotteDispoC: 99999 });
    egal("cagnotte plafonnée au prix restant : 57,25 €", grosse.cagnotteC, 5725);

    egal("cagnotte maximale : plus de crédit d'impôt", grosse.creditImpotC, 0);
  }
  // Offre de lancement : 3 mois de Pro offerts aux inscrits jusqu'au 31 janvier 2027, sans limite de places
  {
    const { joursOffreLancement, finOffreLancement } = await import("./assets/js/regles.js");

  // Accueil vivant : prochaine prestation et « À faire » (mêmes règles que l'appli, AccueilVivant.kt)
  const { prochaine, aFaire, compteARebours } = await import("./assets/js/tableau.js");
  const dem = [

  egal("prochaine : celle en route passe d'abord", prochaine(dem).reference, "B");

  const af = aFaire({ profil: { statuts: ["particulier"], telephone: "", dossier: "BROUILLON" }, demandes: dem, biens: [] });

  egal("compte à rebours : 2 j 3 h", compteARebours(new Date(Date.UTC(2027, 0, 3, 3, 0)).toISOString(), Date.UTC(2027, 0, 1, 0, 0)).replace(/\s+/g, " "), "dans 2 j 3 h");
  egal("draps : 10 min par lit au planning", avec.dureeMin - sans.dureeMin, 2 * REGLES.LAVAGE_DRAPS_MIN_PAR_LIT);
  egal("draps : même prix en zone Prestige", parcours({ ...loc, lavageDraps: true, lits: 2, codePostal: "98000" }).totalC - parcours({ ...loc, codePostal: "98000" }).totalC, 2400);
  egal("draps : un lit par chambre par défaut", entreeEstimation({ ...BR, ...loc, lavageDraps: true, chambres: 3 }, true, null).lavageDrapsLits, 3);
}
