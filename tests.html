<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tests des prix</title>
<meta name="robots" content="noindex">
<style>body{font:15px system-ui;margin:24px}li.ok{color:#2E9E72}li.ko{color:#D0485A;font-weight:700}</style></head>
<body>
<h1>Tests : mêmes prix que l'application</h1>
<p id="bilan">…</p>
<ul id="liste"></ul>
<script type="module">
// Reprend app/src/test/.../ReglesTest.kt : le site doit donner exactement les mêmes résultats que l'application.
import { calculer, meilleurPack, disponibilite, entreeEstimation, complementMinimum, datesPassages, passagesPlanifies, formuleDe } from "./assets/js/estimation.js";
import { rubrique, pastille, tacheChiffree, tachesPour, packsPour, remisePack, DERNIERS_NETTOYAGES } from "./assets/js/catalogue.js";
import { euros, REGLES } from "./assets/js/regles.js";
const res = [];
const egal = (nom, obtenu, attendu) => res.push([nom, obtenu === attendu, `obtenu ${obtenu}, attendu ${attendu}`]);
const t = id => rubrique("home").taches.find(x => x.id === id);
const menage = (o = {}) => calculer({ rubriqueId: "home", surfaceM2: o.surface ?? 62, m2ParHeure: 25, minimumMin: 120,
  taches: o.taches ?? [], remisePackPct: o.remise ?? 0, dimanche: !!o.dimanche, creneauMalin: !!o.malin,
  engagementMois: o.engagement ?? 0, espacePersonnel: o.personnel ?? true });

egal("euros 7200", euros(7200), "72,00 €");
egal("euros 123456", euros(123456), "1 234,56 €");
egal("euros 5", euros(5), "0,05 €");
let e = menage();
egal("ménage : durée", e.dureeMin, 150); egal("ménage : total", e.totalC, 6725);
egal("ménage : crédit d'impôt", e.creditImpotC, 3363); egal("ménage : 1 Cleaneur", e.nombreCleaneurs, 1); egal("ménage : pas de devis", e.devisObligatoire, false);
egal("dimanche", menage({ dimanche: true }).totalC, 6725 + 1681);
egal("créneau malin", menage({ malin: true }).totalC, 6725 - 673);
egal("engagement 6 mois", menage({ engagement: 6 }).totalC, 6725 - 673);
e = menage({ taches: ["draps", "poubelles", "hauteurs", "plinthes"].map(t), remise: 5 });
egal("pack Essentiel : total (remise 2,15 € → 2 €)", e.totalC, 6725 + 4300 - 200); egal("pack Essentiel : durée", e.dureeMin, 150 + 10 + 5 + 20 + 20);
const packs = rubrique("home").packs, confort = packs.find(p => p.id === "confort").tacheIds;
egal("meilleur pack", meilleurPack(packs, confort)?.id, "confort");
egal("pack incomplet", meilleurPack(packs, confort.filter(x => x !== "draps")), null);
egal("véhicule minimum", calculer({ rubriqueId: "car", taches: [rubrique("car").taches.find(x => x.id === "aspiration")] }).totalC, REGLES.MINIMUM_COMMANDE_VEHICULE_C);
e = menage({ surface: 200 });
egal("2 Cleaneurs au-delà de 6 h", e.nombreCleaneurs, 2); egal("durée partagée", e.dureeMin, 240);
egal("devis au-delà de 300 m²", menage({ surface: 301 }).devisObligatoire, true);
e = calculer({ rubriqueId: "office", minimumMin: 120, salissure: "MARQUE", espacePersonnel: false });
egal("bureaux salissure marquée", e.totalC, 5900 + 885); egal("bureaux sans crédit d'impôt", e.creditImpotC, 0);
const mardi15h = new Date(); mardi15h.setDate(mardi15h.getDate() + ((2 - mardi15h.getDay() + 7) % 7 || 7) + 7); mardi15h.setHours(14, 0, 0, 0);
egal("créneau malin mardi 14 h", disponibilite(new Date(), mardi15h), "MALIN");

// Grille tarifaire du 5 novembre 2026 (espace Personnel, semaine hors créneau malin, salissure normale) : mêmes cas que ReglesTest.kt
const BR = { surface: 62, chambres: 2, sdb: 1, niveaux: 1, fenetres: 8, typeLieuId: "", salissure: "NORMAL", taches: [], tachesPerso: [],
  consommables: false, engagementMois: 0, flexible: false, panier: [] };
const parcours = o => calculer(entreeEstimation({ ...BR, ...o }, true, null));
const espaces = s => s.replace(/\s/g, " ");
e = parcours({ rubriqueId: "home", formuleId: "ponctuel" });
egal("1. logement 62 m² : 150 min", e.dureeMin, 150); egal("1. logement 62 m² : 67,25 €", e.totalC, 6725);
egal("pastille logement", espaces(pastille(rubrique("home"))), "dès 26,90 € / h");
egal("pastille location", espaces(pastille(rubrique("rental"))), "dès 35 € le ménage");
egal("pastille véhicules", espaces(pastille(rubrique("car"))), "dès 40 €");
egal("pastille textiles", espaces(pastille(rubrique("textiles"))), "dès 45 € l'élément");
e = parcours({ rubriqueId: "rental", formuleId: "court" });
egal("2. location 62 m² : 105 min", e.dureeMin, 105); egal("2. location 62 m² : 52,50 €", e.totalC, 5250);
e = parcours({ rubriqueId: "rental", formuleId: "court", surface: 25, chambres: 0 });
egal("3. studio : 75 min", e.dureeMin, 75); egal("3. studio : 37,50 €", e.totalC, 3750);
egal("3. complément minimum : 30 € → 35 €", 3000 + complementMinimum(3000, REGLES.MINIMUM_MENAGE_LOCATION_C), 3500);
e = parcours({ rubriqueId: "moving", formuleId: "depart" });
egal("4. déménagement : 224,00 €", e.totalC, 22400); egal("4. confié à 2 Cleaneurs", e.nombreCleaneurs, 2); egal("4. durée sur place divisée par 2", e.dureeMin, 210);
e = parcours({ rubriqueId: "textiles", formuleId: "canape", panier: [{ elementId: "canape_droit", tailleId: "t20", quantite: 1 }, { elementId: "fauteuil", quantite: 1 }] });
egal("5. canapé droit 1,5–2 m + fauteuil : 124,00 €", e.totalC, 12400); egal("5. durée 105 min", e.dureeMin, 105);
egal("5. libellé de ligne", e.lignes[0].libelle, "Canapé droit 1,5 – 2 m × 1");
e = parcours({ rubriqueId: "textiles", formuleId: "canape", panier: [{ elementId: "fauteuil", quantite: 1 }] });
egal("6. fauteuil seul → 59,00 €", e.totalC, 5900);
egal("6. complément de 14 €", e.lignes.find(l => l.libelle === "Complément minimum de commande")?.montantC, 1400);
e = parcours({ rubriqueId: "textiles", formuleId: "tapis", panier: [{ elementId: "tapis_3", quantite: 1 }] });
egal("7. tapis de 2 à 3 m : 65,00 €", e.totalC, 6500); egal("7. sans complément", e.lignes.some(l => l.libelle.startsWith("Complément")), false);
e = calculer({ rubriqueId: "textiles", salissure: "MARQUE", panier: [{ elementId: "tapis_3", quantite: 1 }] });
egal("textiles : salissure en prix (+15 %)", e.totalC, 6500 + 975);

// Règles communes de l'étape « Décrire le besoin » : mêmes cas que ReglesTest.kt
const T0 = (id, nom, prixC, minutes, o = {}) => ({ id, nom, prixC, minutes, groupe: "", parSurface: false, types: [], ...o });
const essai = { id: "essai", surfaceReferenceM2: 30, taches: [
  T0("sol", "Sol", 1500, 20, { groupe: "Sols", parSurface: true }), T0("vitrine", "Vitrine", 2500, 25, { groupe: "Vente", types: ["boutique"] }),
  T0("claviers", "Claviers", 1500, 20, { groupe: "Travail", types: ["bureaux"] })],
  packs: [{ id: "essentiel", remisePct: 5, tacheIds: ["sol", "claviers"] }, { id: "confort", remisePct: 10, tacheIds: ["sol", "claviers", "vitrine"] }, { id: "prestige", remisePct: 15, tacheIds: ["vitrine"] }] };
egal("surface : sous la référence", tacheChiffree(essai.taches[0], essai, 20).prixC, 1500);
egal("surface : 150 % → 22,50 € arrondi à 23 €", tacheChiffree(essai.taches[0], essai, 45).prixC, 2300);
egal("surface : durée au prorata", tacheChiffree(essai.taches[0], essai, 45).minutes, 30);
egal("tâches selon le type", tachesPour(essai, "bureaux").map(t => t.id).join(), "sol,claviers");
egal("packs selon le type (vide masqué, doublon → plus remisé)", packsPour(essai, "bureaux").map(p => p.id).join(), "confort");
const chEssai = tachesPour(essai, "boutique").map(t => tacheChiffree(t, essai, 30)), pkEssai = packsPour(essai, "boutique");
egal("remise Confort 4 €", remisePack(pkEssai.find(p => p.id === "confort"), chEssai), 400);
egal("remise Prestige 3,75 € → 4 €", remisePack(pkEssai.find(p => p.id === "prestige"), chEssai), 400);
egal("une seule remise, la plus élevée", meilleurPack(pkEssai, ["sol", "vitrine"], chEssai)?.id, "prestige");
const lundi = new Date(2027, 0, 4), jour = d => `${d.getDate()}/${d.getMonth() + 1}`;
egal("passages toutes les 2 semaines", datesPassages(lundi, "deux_semaines", [], 3).map(jour).join(" "), "4/1 18/1 1/2");
egal("passages lundi et jeudi", datesPassages(lundi, "plusieurs", [1, 4], 3).map(jour).join(" "), "4/1 7/1 11/1");
egal("4 passages en entretien régulier", passagesPlanifies({ rubriqueId: "home", formuleId: "regulier", passages: 4 }), 4);
egal("1 passage en ponctuel", passagesPlanifies({ rubriqueId: "home", formuleId: "ponctuel", passages: 4 }), 1);
egal("dernier nettoyage → saleté", DERNIERS_NETTOYAGES.map(d => d.salissure).join(), "NORMAL,MARQUE,MARQUE,INTENSE");
egal("remise en état des bureaux", formuleDe({ rubriqueId: "office", formuleId: "remise" }).genre, "REMISE_EN_ETAT");

const ok = res.filter(r => r[1]).length;
document.getElementById("bilan").textContent = `${ok} tests sur ${res.length} réussis`;
document.getElementById("liste").innerHTML = res.map(([n, b, d]) => `<li class="${b ? "ok" : "ko"}">${b ? "✓" : "✗"} ${n}${b ? "" : " — " + d}</li>`).join("");
</script>
</body>
</html>
