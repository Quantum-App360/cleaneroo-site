    .filtres { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }

    .filtres button.choisi { background: var(--turquoise); color: #fff; border-color: var(--turquoise); }

    .detail-demande dd { margin: 2px 0 0; color: var(--texte2); }

    body { background: #EEF3F3; }
    .bo { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 68px); }
    .bo-nav { background: #0B3B3D; color: #CFE3E1; padding: 18px 12px; position: sticky; top: 68px; height: calc(100vh - 68px); overflow-y: auto; }
    .bo-nav .bo-marque { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #7FB8B2; font-weight: 800; padding: 4px 12px 14px; }
    .bo-nav button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; margin-bottom: 4px; border: 0; border-radius: 12px;
      background: none; color: inherit; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; text-align: left; }
    .bo-nav button .ico { width: 20px; height: 20px; flex: none; }
    .bo-nav button:hover { background: rgba(255,255,255,.07); color: #fff; }
    .bo-nav button.choisi { background: #146B63; color: #fff; box-shadow: inset 3px 0 0 #3BE0C9; }
    .bo-nav .badge { margin-left: auto; min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px; background: #FA8C66; color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; }
    .bo-nav .badge.calme { background: rgba(255,255,255,.14); color: #CFE3E1; }
    .bo-corps { padding: 24px 28px 60px; min-width: 0; }
    .bo-corps #vue { max-width: 1200px; }
    .bo-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; max-width: 1200px; }
    .bo-kpi .kpi { background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: 0 2px 10px rgba(8,38,42,.06); border: 1px solid #E1EAEA; cursor: pointer; text-align: left; font: inherit; }
    .bo-kpi .kpi b { display: block; font-size: 28px; font-weight: 800; color: #0B3B3D; line-height: 1.1; }
    .bo-kpi .kpi span { font-size: 13px; color: #5B7275; font-weight: 600; }
    .bo-kpi .kpi.alerte b { color: #D2563C; }
    .bo-titre { margin: 0 0 4px; font-size: 26px; }
    .bo-corps .carte { border-radius: 14px; }
    .bo-corps .ligne-demande { grid-template-columns: 1fr auto; align-items: center; transition: box-shadow .15s, transform .15s; }
    .bo-corps .ligne-demande:hover { box-shadow: 0 6px 18px rgba(8,38,42,.10); transform: translateY(-1px); }
    .tampon.spam { background: #FDE2DC; color: #B0341D; }
    .selfies-admin .paire { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .selfies-admin img { width: 120px; height: 120px; object-fit: cover; border-radius: 12px; background: var(--creux); }
    .bo.sans-menu { grid-template-columns: 1fr; } .bo.sans-menu .bo-nav, .bo.sans-menu .bo-kpi { display: none; }
    .bo.sans-menu #vue { max-width: 560px; margin: 0 auto; }
    @media (max-width: 900px) {
      .bo { grid-template-columns: 1fr; }
      .bo-nav { position: sticky; top: 64px; z-index: 10; height: auto; display: flex; gap: 6px; overflow-x: auto; padding: 8px 10px; }
      .bo-nav .bo-marque { display: none; }
      .bo-nav button { width: auto; flex: none; margin: 0; white-space: nowrap; }
      .bo-corps { padding: 16px; }
      .bo-kpi { grid-template-columns: repeat(2, 1fr); }
    }
